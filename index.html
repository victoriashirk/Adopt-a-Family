<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adopt-a-Family Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--snow:#FFFCFC;--pine:#04391D;--leaf:#4A8445;--ice:#C1E4F5;--rose:#FF758A;--wine:#6F0807;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--snow);color:var(--pine);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;line-height:1.1}
header{background:var(--pine);color:var(--snow);padding:28px 20px 0}
.wrap{max-width:980px;margin:0 auto}
header h1{font-size:clamp(28px,5vw,44px);font-weight:800}
header p{margin:6px 0 18px;color:var(--ice)}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{border:0;background:transparent;color:var(--ice);font:600 15px Figtree,sans-serif;padding:12px 18px;border-radius:12px 12px 0 0;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{background:var(--snow);color:var(--pine)}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
main{padding:24px 20px 60px}
section[hidden]{display:none}
.banner{background:var(--ice);border-radius:14px;padding:12px 16px;margin-bottom:18px;font-size:14px}
.goal{background:var(--pine);color:var(--snow);border-radius:18px;padding:22px;margin-bottom:22px}
.goal .row{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:end;justify-content:space-between}
.big{font:800 clamp(34px,7vw,56px)/1 Fraunces,serif}
.bar{position:relative;height:26px;background:rgba(255,252,252,.15);border-radius:13px;margin-top:16px;overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--rose) 0 22px,var(--leaf) 22px 44px);border-radius:13px;transition:width .5s}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--ice);border-radius:14px;padding:14px 16px}
.stat b{display:block;font:800 26px Fraunces,serif}
.stat.warn{background:var(--rose)}
form.add{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;padding:16px;border:2px solid var(--leaf);border-radius:16px}
input,select{font:inherit;color:var(--pine);background:var(--snow);border:2px solid var(--leaf);border-radius:10px;padding:9px 12px;min-width:0}
form.add input,form.add select{flex:1 1 150px}
.btn{font:600 15px Figtree,sans-serif;background:var(--leaf);color:var(--snow);border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
.btn:hover{background:var(--pine)}
.btn.ghost{background:transparent;color:var(--wine);padding:6px 10px}
.btn.ghost:hover{background:var(--rose);color:var(--pine)}
.list{display:grid;gap:8px}
.rowitem{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:12px;background:#fff;border:1px solid var(--ice)}
.rowitem .amt{font:800 20px Fraunces,serif}
.muted{color:var(--leaf);font-size:14px}
.pill{border:0;border-radius:99px;padding:6px 14px;font:600 13px Figtree,sans-serif;cursor:pointer}
.pill.yes{background:var(--leaf);color:var(--snow)}
.pill.no{background:var(--rose);color:var(--pine)}
.reimb{display:inline-flex;gap:6px;align-items:center;font-weight:600;font-size:14px;cursor:pointer}.reimb input{width:20px;height:20px;accent-color:var(--leaf)}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:22px}
button.card{text-align:left;font:inherit;color:inherit;border:0;border-radius:16px;padding:18px;background:var(--ice);cursor:pointer}
button.card:hover{box-shadow:0 0 0 3px var(--leaf)}button.card.pink{background:var(--rose)}button.card.dark{background:var(--leaf);color:var(--snow)}
button.card b{display:block;font:800 30px Fraunces,serif;margin:2px 0}
.empty{padding:24px;text-align:center;border:2px dashed var(--ice);border-radius:14px;color:var(--leaf)}
.member{border:2px solid var(--ice);border-radius:16px;margin-bottom:14px;overflow:hidden}
.member>div:first-child{background:var(--ice);padding:12px 16px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
.member h3{font-size:20px}
.item{display:flex;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--ice)}
.item input{width:20px;height:20px;accent-color:var(--leaf);flex:none}
.item span{flex:1}
.item.done span{text-decoration:line-through;color:var(--leaf)}
.mini{height:8px;background:#fff;border-radius:4px;width:120px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--leaf)}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.team{border-radius:16px;padding:16px;min-height:150px}
.team h3{font-size:22px;margin-bottom:10px}
.t0{background:var(--leaf);color:var(--snow)}.t1{background:var(--ice)}.t2{background:var(--rose)}.t3{background:var(--wine);color:var(--snow)}
.chip{display:flex;justify-content:space-between;align-items:center;gap:6px;background:rgba(255,252,252,.85);color:var(--pine);border-radius:10px;padding:6px 8px 6px 12px;margin-bottom:6px}
.chip select{border:0;padding:2px;font-size:13px;background:transparent;max-width:92px}
.chip .x{border:0;background:none;color:var(--wine);cursor:pointer;font-size:18px;line-height:1}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<header><div class="wrap">
<h1>Adopt-a-Family Tracker</h1>
<p>Donations, receipts, wish lists and teams in one place.</p>
<nav role="tablist" id="tabs"></nav>
</div></header>
<div class="wrap" id="access" style="padding:20px"><div class="banner">Connecting to shared tracker…</div></div>
<main id="tracker-main" hidden><div class="wrap">
<div id="banner"></div>

<section id="p-home"><div id="home"></div></section>

<section id="p-teams" hidden>
<datalist id="roster"></datalist>
<h3 style="margin-bottom:4px">Not on a team yet</h3><p class="muted" style="margin:0 0 10px">Pick a team and your name moves into that team box.</p><div id="l-unas" class="list" style="margin-bottom:22px"></div>
<form class="add" id="f-ppl"><input name="name" list="roster" placeholder="Add someone else" required><select name="team" id="sel-team"></select><button class="btn">Add to team</button></form>
<div class="teams" id="l-teams"></div>
</section>
   
<section id="p-donations" hidden>
<div class="goal"><div class="row"><div><div class="muted" style="color:var(--ice)">Raised so far</div><div class="big" id="raised"></div></div>
<div style="text-align:right"><div style="color:var(--ice)">Goal</div><div class="big" style="font-size:30px" id="goalv"></div></div></div>
<div class="bar" role="progressbar" aria-label="Fundraising progress"><i id="gbar" style="width:0"></i></div>
<div id="gtext" style="margin-top:10px"></div></div>
<form class="add" id="f-goal"><input name="amount" type="number" min="1" step="any" placeholder="Set goal amount ($)" required><button class="btn">Save goal</button></form>
<form class="add" id="f-don"><input name="donor" list="roster" placeholder="Donor name (pick or type)" required><input name="amount" type="number" min="0.01" step="any" placeholder="Amount ($)" required><input name="date" type="date"><button class="btn">Add donation</button></form>
<div class="list" id="l-don"></div>
</section>

<section id="p-receipts" hidden>
<div class="stats" id="s-rec"></div>
<form class="add" id="f-rec"><input name="shopper" list="roster" placeholder="Shopper (pick or type)" required><input name="store" placeholder="Store"><input name="amount" type="number" min="0.01" step="any" placeholder="Amount spent ($)" required><select name="member" id="sel-rmem" aria-label="Family member this was for"></select><input name="date" type="date"><button class="btn">Add receipt</button></form>
<div class="list" id="l-rec"></div>
</section>

<section id="p-lists" hidden>
<div class="stats" id="s-lists"></div>
<form class="add" id="f-mem"><input name="name" placeholder="Family member (e.g. Maria, 8)" required><input name="note" placeholder="Sizes or notes (optional)"><button class="btn">Add family member</button></form>
<form class="add" id="f-item"><select name="member" id="sel-mem" required></select><input name="text" placeholder="Wish list item" required><button class="btn">Add item</button></form>
<div id="l-lists"></div>
</section>

</div></main>

<script type="module">
/* SETUP: Replace these placeholders with your Firebase web app configuration.
   Firebase Console -> Project settings -> Your apps -> Web app -> Config.
   Use CLOUD FIRESTORE (not Realtime Database); enable Anonymous sign-in.
   Deploy firestore.rules alongside these instructions in the Firebase console.
*/
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCa_LaR2UTjXsbwaNX6JwAoLr0PJtQILDQ",
  authDomain: "cg-adopt-a-family-tracker.firebaseapp.com",
  projectId: "cg-adopt-a-family-tracker",
  storageBucket: "cg-adopt-a-family-tracker.firebasestorage.app",
  messagingSenderId: "291847687958",
  appId: "1:291847687958:web:c704ce462b0169a3090a37",
  measurementId: "G-R87K1S2XFQ"
};
let firestore, auth, userAuthorized = false, unsubscribers = [];
const configured = !Object.values(firebaseConfig).some(v => v.includes("PASTE_"));
const access = document.getElementById("access");
const trackerMain = document.getElementById("tracker-main");
function showAccess(message) {
  trackerMain.hidden = !userAuthorized;
  access.hidden = userAuthorized;
  access.innerHTML = userAuthorized ? "" : `<div class="banner">${esc(message)}</div>`;
}

const ROSTER="Abi Anna Bailey Bennett Bryce Caroline Carter Charlie Drake Emily Gracie Jacelynn Julia Kevin Kylie Lexi Logan Luke Matt Paul Skyler Tori".split(" ");
const TEAMS=["Shopping team","Wrapping team","Delivery team"];
const TABS=[["home","Home"],["teams","Teams"],["lists","Wish lists"],["receipts","Receipts"],["donations","Donations"]];
const S={donations:[],receipts:[],members:[],items:[],people:[],settings:[]};
let tab="home";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(n||0);
const sum=a=>a.reduce((t,x)=>t+(+x.amount||0),0);
const day=d=>d?new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"}):"";
function toast(m){$("#banner").innerHTML=`<div class="banner">${esc(m)}</div>`;setTimeout(()=>$("#banner").innerHTML="",5000)}
async function run(p){try{await p}catch(e){toast("Could not save: " + (e.message || "Permission denied."));}}
function permitted(){if(!userAuthorized){toast("Connecting to the shared database. Try again in a moment.");return false;}return true;}
function add(c,o){if(!permitted())return;o.t=Date.now();return run(addDoc(collection(firestore,c),o));}
function upd(c,id,o){if(!permitted())return;return run(updateDoc(doc(firestore,c,id),o));}
function del(c,id){if(!permitted())return;return run(deleteDoc(doc(firestore,c,id)));}
function setGoal(a){if(!permitted())return;return run(setDoc(doc(firestore,"settings","goal"),{amount:a}));}
const goal=()=>+(S.settings.find(x=>x.id==="goal")||{}).amount||0;
const byNew=a=>[...a].sort((x,y)=>(y.t||0)-(x.t||0));

function renderTabs(){
 $("#tabs").innerHTML=TABS.map(([k,l])=>`<button role="tab" data-t="${k}" aria-selected="${k===tab}">${l}</button>`).join("");
 TABS.forEach(([k])=>$("#p-"+k).hidden=k!==tab);
}
function render(){
 renderTabs();
 // donations
 const raised=sum(S.donations),g=goal(),pct=g?Math.min(100,raised/g*100):0;
 $("#raised").textContent=money(raised);$("#goalv").textContent=g?money(g):"Not set";
 $("#gbar").style.width=pct+"%";
 $("#gtext").textContent=!g?"Set a goal to start tracking progress.":raised>=g?"Goal reached. Thank you, everyone!":`${pct.toFixed(0)}% there. ${money(g-raised)} to go.`;
 $("#l-don").innerHTML=S.donations.length?byNew(S.donations).map(d=>`<div class="rowitem"><div><b>${esc(d.donor)}</b> <span class="muted">${day(d.date)}</span></div><div><span class="amt">${money(d.amount)}</span> <button class="btn ghost" data-del="donations:${d.id}" aria-label="Delete donation from ${esc(d.donor)}">Delete</button></div></div>`).join(""):`<div class="empty">No donations yet. Add the first one above.</div>`;
 // receipts
 const spent=sum(S.receipts),paid=sum(S.receipts.filter(r=>r.reimbursed)),owed=spent-paid;
 $("#s-rec").innerHTML=`<div class="stat">Total spent<b>${money(spent)}</b></div><div class="stat">Reimbursed<b>${money(paid)}</b></div><div class="stat warn">Still owed to shoppers<b>${money(owed)}</b></div>`;
 const owedBy={};S.receipts.filter(r=>!r.reimbursed).forEach(r=>owedBy[r.shopper]=(owedBy[r.shopper]||0)+(+r.amount||0));
 const owedTxt=Object.entries(owedBy).map(([n,v])=>`${esc(n)}: ${money(v)}`).join(" · ");
 $("#l-rec").innerHTML=(owedTxt?`<div class="banner">Owed by shopper: ${owedTxt}</div>`:"")+(S.receipts.length?byNew(S.receipts).map(r=>`<div class="rowitem"><div><b>${esc(r.shopper)}</b> <span class="muted">${esc(r.store||"")} ${day(r.date)}</span>${r.memberName?`<div class="muted">For: <b>${esc(r.memberName)}</b></div>`:""}</div><div><span class="amt">${money(r.amount)}</span> <label class="reimb"><input type="checkbox" data-reimb="${r.id}" ${r.reimbursed?"checked":""}> Reimbursed</label> <button class="btn ghost" data-del="receipts:${r.id}" aria-label="Delete receipt">Delete</button></div></div>`).join(""):`<div class="empty">No receipts yet. Shoppers can log what they spent above.</div>`);
 const rs=$("#sel-rmem"),rc=rs.value;
 rs.innerHTML=`<option value="">For which family member?</option>`+S.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join("");
 rs.value=rc;
 // lists
 const bought=S.items.filter(i=>i.bought).length;
 $("#s-lists").innerHTML=`<div class="stat">Family members<b>${S.members.length}</b></div><div class="stat">Items purchased<b>${bought} of ${S.items.length}</b></div><div class="stat warn">Still to buy<b>${S.items.length-bought}</b></div>`;
 const sel=$("#sel-mem"),cur=sel.value;
 sel.innerHTML=S.members.length?S.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join(""):`<option value="">Add a family member first</option>`;
 if(cur)sel.value=cur;
 $("#l-lists").innerHTML=S.members.length?byNew(S.members).reverse().map(m=>{
  const its=S.items.filter(i=>i.member===m.id).sort((a,b)=>(a.t||0)-(b.t||0)),n=its.filter(i=>i.bought).length;
  return `<div class="member"><div><div><h3>${esc(m.name)}</h3><span class="muted">${esc(m.note||"")}</span></div><div style="display:flex;gap:10px;align-items:center"><span class="muted">${n} of ${its.length} bought</span><div class="mini"><i style="width:${its.length?n/its.length*100:0}%"></i></div><button class="btn ghost" data-delmem="${m.id}">Remove</button></div></div>`+
  (its.length?its.map(i=>`<label class="item ${i.bought?"done":""}"><input type="checkbox" data-buy="${i.id}" ${i.bought?"checked":""}><span>${esc(i.text)}</span><button type="button" class="btn ghost" data-del="items:${i.id}" aria-label="Delete ${esc(i.text)}">×</button></label>`).join(""):`<div class="item muted">No items yet.</div>`)+`</div>`}).join(""):`<div class="empty">No families added yet. Add a family member to start their list.</div>`;
 // home
 const nb=S.items.filter(i=>i.bought).length,ni=S.items.length;
 const memRows=S.members.map(m=>{const it=S.items.filter(i=>i.member===m.id),b=it.filter(i=>i.bought).length;return `<div class="rowitem"><b>${esc(m.name)}</b><span style="display:flex;gap:10px;align-items:center"><span class="muted">${b} of ${it.length} bought</span><span class="mini"><i style="width:${it.length?b/it.length*100:0}%"></i></span></span></div>`}).join("");
 const tc=TEAMS.map((t,i)=>`<div class="stat t${i}" style="border-radius:14px;padding:12px 16px">${t}<b style="font:800 24px Fraunces,serif;display:block">${S.people.filter(p=>p.team===t).length}</b></div>`).join("");
 $("#home").innerHTML=`<div class="goal"><div class="row"><div><div style="color:var(--ice)">Raised so far</div><div class="big">${money(raised)}</div></div><div style="text-align:right"><div style="color:var(--ice)">Goal</div><div class="big" style="font-size:30px">${g?money(g):"Not set"}</div></div></div><div class="bar"><i style="width:${pct}%"></i></div><div style="margin-top:10px">${$("#gtext").textContent}</div></div>
 <div class="dash"><button class="card dark" data-t="donations">Donations<b>${S.donations.length}</b>${new Set(S.donations.map(d=>d.donor)).size} donors</button>
 <button class="card pink" data-t="receipts">Still owed to shoppers<b>${money(owed)}</b>${money(spent)} spent in total</button>
 <button class="card" data-t="lists">Gifts purchased<b>${nb} of ${ni}</b>${S.members.length} family members</button></div>
 <h3 style="margin-bottom:10px">Wish list progress</h3><div class="list" style="margin-bottom:22px">${memRows||`<div class="empty">No family members yet. Add them on the Wish lists tab.</div>`}</div>
 <h3 style="margin-bottom:10px">Teams</h3><div class="stats">${tc}</div>`;
 // teams
 $("#roster").innerHTML=ROSTER.map(n=>`<option value="${n}">`).join("");
 const placed=new Set(S.people.filter(p=>TEAMS.includes(p.team)).map(p=>p.name.toLowerCase()));
 const un=ROSTER.filter(n=>!placed.has(n.toLowerCase()));
 $("#l-unas").innerHTML=un.length?`<div class="rowitem" style="gap:8px">${un.map(n=>`<span class="chip" style="background:var(--ice);margin:0"><span>${n}</span><select data-assign="${n}" aria-label="Assign ${n} to a team"><option value="">Assign…</option>${TEAMS.map(t=>`<option>${t}</option>`).join("")}</select></span>`).join("")}</div>`:`<div class="empty">Everyone is on a team.</div>`;
 const ts=$("#sel-team");if(!ts.options.length)ts.innerHTML=TEAMS.map(t=>`<option>${t}</option>`).join("");
 $("#l-teams").innerHTML=TEAMS.map((t,i)=>{const ppl=S.people.filter(p=>p.team===t);
  return `<div class="team t${i}"><h3>${t}</h3>${ppl.length?ppl.map(p=>`<div class="chip"><span>${esc(p.name)}</span><span><select data-move="${p.id}" aria-label="Move ${esc(p.name)}">${TEAMS.map(x=>`<option ${x===t?"selected":""}>${x}</option>`).join("")}</select><button class="x" data-del="people:${p.id}" aria-label="Remove ${esc(p.name)}">×</button></span></div>`).join(""):`<span>No one yet</span>`}</div>`}).join("");
}

document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.t){tab=b.dataset.t;render()}
 else if(b.dataset.del){const[c,id]=b.dataset.del.split(":");del(c,id)}
 else if(b.dataset.reimb){const r=S.receipts.find(x=>x.id===b.dataset.reimb);upd("receipts",r.id,{reimbursed:!r.reimbursed})}
 else if(b.dataset.delmem){const id=b.dataset.delmem;if(confirm("Remove this family member and their list?")){S.items.filter(i=>i.member===id).forEach(i=>del("items",i.id));del("members",id)}}
});
document.addEventListener("change",e=>{
 if(e.target.dataset.buy)upd("items",e.target.dataset.buy,{bought:e.target.checked});
 if(e.target.dataset.assign&&e.target.value){const ex=S.people.find(p=>p.name.toLowerCase()===e.target.dataset.assign.toLowerCase());ex?upd("people",ex.id,{team:e.target.value}):add("people",{name:e.target.dataset.assign,team:e.target.value});}
 if(e.target.dataset.reimb)upd("receipts",e.target.dataset.reimb,{reimbursed:e.target.checked});
 if(e.target.dataset.move)upd("people",e.target.dataset.move,{team:e.target.value});
});
function form(id,fn){$(id).addEventListener("submit",e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));fn(f);if(id!=="#f-item")e.target.reset();else e.target.text.value=""})}
form("#f-goal",f=>setGoal(+f.amount));
form("#f-don",f=>add("donations",{donor:f.donor.trim(),amount:+f.amount,date:f.date||new Date().toISOString().slice(0,10)}));
form("#f-rec",f=>add("receipts",{member:f.member,memberName:(S.members.find(m=>m.id===f.member)||{}).name||"",shopper:f.shopper.trim(),store:f.store.trim(),amount:+f.amount,date:f.date||new Date().toISOString().slice(0,10),reimbursed:false}));
form("#f-mem",f=>add("members",{name:f.name.trim(),note:f.note.trim()}));
form("#f-item",f=>{if(f.member)add("items",{member:f.member,text:f.text.trim(),bought:false})});
form("#f-ppl",f=>{const n=f.name.trim(),ex=S.people.find(p=>p.name.toLowerCase()===n.toLowerCase());ex?upd("people",ex.id,{team:f.team}):add("people",{name:n,team:f.team})});

async function init(){
  render();
  if(!configured){showAccess("Firebase setup is incomplete.");return;}
  try {
    const app = initializeApp(firebaseConfig);
    firestore = getFirestore(app);
    auth = getAuth(app);
    onAuthStateChanged(auth, async user => {
      unsubscribers.forEach(stop => stop()); unsubscribers = [];
      userAuthorized = false;
      if (!user) {
        showAccess("Connecting securely to the shared tracker…");
        try { await signInAnonymously(auth); }
        catch(e) { showAccess("Unable to connect. Enable Anonymous under Firebase Authentication → Sign-in method. Details: " + e.message); }
        return;
      }
      userAuthorized = true;
      showAccess("");
      for(const c of Object.keys(S)) {
        const stop = onSnapshot(collection(firestore,c), snapshot => {
          S[c] = snapshot.docs.map(d => ({id:d.id,...d.data()}));
          render();
        }, error => toast("Could not load " + c + ": " + error.message));
        unsubscribers.push(stop);
      }
    },error => showAccess("Authentication problem: " + error.message));
  } catch(e) {showAccess("Firebase configuration error: " + e.message);}
}

init();
</script>
</body>
</html>
